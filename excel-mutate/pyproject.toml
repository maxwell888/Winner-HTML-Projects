[project]
name = "excel-mutate"
version = "0.1.0"
description = "改 Excel 模板(增删行/列/sheet/cell),自动重写公式"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "rich>=13.0",
    "textual>=0.60",
]

[project.scripts]
excel-mutate = "excel_mutate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel_mutate"]
