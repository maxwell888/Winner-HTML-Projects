<script>
// ===== 全局错误显示 =====
var _loadErrors = [];
window.onerror = function(msg, url, line) {
  _loadErrors.push({msg:msg, url:url, line:line});
  var el = document.getElementById('error-display');
  if (el) {
    el.style.display = 'block';
    el.textContent = '⚠️ JS错误: ' + msg + ' (行' + line + ')';
  }
  var status = document.getElementById('load-status');
  if (status) status.textContent = '❌ 有错误! 按 F12 查看控制台';
};

// ===== 庆祝特效（轻量替代 canvas-confetti） =====
(function(){
  var confettiCanvas = document.createElement('canvas');
  confettiCanvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:9999';
  document.body.appendChild(confettiCanvas);
  var ctx = confettiCanvas.getContext('2d');
  var particles = [];
  var running = false;

  function resize() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  window.confetti = function(opts) {
    opts = opts || {};
    var count = opts.particleCount || 50;
    var spread = opts.spread || 70;
    var originX = (opts.origin && opts.origin.x !== undefined) ? opts.origin.x * confettiCanvas.width : confettiCanvas.width / 2;
    var originY = (opts.origin && opts.origin.y !== undefined) ? opts.origin.y * confettiCanvas.height : confettiCanvas.height * 0.6;
    var colors = ['#10B981','#F59E0B','#EF4444','#3B82F6','#8B5CF6','#EC4899','#34D399','#F97316'];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: originX, y: originY,
        vx: (Math.random() - 0.5) * spread * 0.1,
        vy: -Math.random() * 8 - 2,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 6 + 3,
        life: 1, decay: Math.random() * 0.02 + 0.008,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10
      });
    }
    if (!running) {
      running = true;
      (function loop() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.vy += 0.15;
          p.y += p.vy;
          p.life -= p.decay;
          p.rotation += p.rotSpeed;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
          ctx.restore();
        }
        if (particles.length > 0) requestAnimationFrame(loop);
        else running = false;
      })();
    }
  };
})();

document.getElementById('load-status').textContent = 'JS 基础框架就绪...';
</script>

class SoundEngine {
  constructor() {
    this.ctx = null; this.enabled = !0;
    this._init = () => { if(!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended') this.ctx.resume(); } };
    ['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,this._init,{once:!0}));
  }
  _play(freq,type,dur,vol,rd){ if(!this.enabled)return; try{this._init(); if(!this.ctx)return; var o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,this.ctx.currentTime); g.gain.setValueAtTime(vol||0.15,this.ctx.currentTime); if(rd!==!1)g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+dur); }catch(e){} }
  correct(){ this._play(523,'sine',0.15,0.15); setTimeout(()=>this._play(659,'sine',0.15,0.15),100); setTimeout(()=>this._play(784,'sine',0.2,0.15),200); }
  incorrect(){ this._play(200,'triangle',0.3,0.08,!1); }

}
const Easing = {
  linear:t=>t, easeInOut:t=>t<.5?2*t*t:-1+(4-2*t)*t,
  easeOutBounce:t=>{var n1=7.5625,d1=2.75; if(t<1/d1)return n1*t*t; else if(t<2/d1)return n1*(t-=1.5/d1)*t+.75; else if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375; else return n1*(t-=2.625/d1)*t+.984375;},
  easeOutElastic:t=>t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t-.075)*(2*Math.PI)/.3)+1,
  easeOutBack:t=>{var c1=1.70158; return 1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
};

class AnimationEngine {
  constructor(){ this.animations=[]; this.running=!1; this.rafId=null; }
  tween(svgEl,props,duration,easing){
    duration=duration||800; var easingFn=typeof easing==='function'?easing:(Easing[easing]||Easing.linear);
    return new Promise(resolve=>{
      var startTime=performance.now(),initial={};
      for(var prop in props){
        var targetVal=props[prop];
        if(prop==='transform')initial[prop]=this._getTransform(svgEl);
        else if(prop==='opacity')initial[prop]=parseFloat(svgEl.getAttribute('opacity')??1);
        else initial[prop]=parseFloat(svgEl.getAttribute(prop)??0);
      }
      var animate=now=>{
        var elapsed=now-startTime,progress=Math.min(elapsed/duration,1),eased=easingFn(progress);
        for(var prop in props){
          var targetVal=props[prop];
          if(prop==='transform')this._setTransform(svgEl,initial[prop],targetVal,eased);
          else if(prop==='opacity'){ svgEl.setAttribute('opacity',initial[prop]+(targetVal-initial[prop])*eased); }
          else if(prop==='fill'){ if(progress>=.5)svgEl.setAttribute('fill',targetVal); }
          else { svgEl.setAttribute(prop,initial[prop]+(targetVal-initial[prop])*eased); }
        }
        if(progress<1)this.rafId=requestAnimationFrame(animate);
        else { for(var p in props){ if(p!=='transform')svgEl.setAttribute(p,props[p]); } resolve(); }
      };
      this.rafId=requestAnimationFrame(animate);
    });
  }
  async sequence(steps){ for(var i=0;i<steps.length;i++){ var s=steps[i]; if(s.delay)await this._wait(s.delay); var el=typeof s.el==='string'?document.querySelector(s.el):s.el; if(el)await this.tween(el,s.props,s.duration||600,s.easing||'easeOutBounce'); } }
  async parallel(anims){ await Promise.all(anims.map(a=>{ var el=typeof a.el==='string'?document.querySelector(a.el):a.el; if(!el)return Promise.resolve(); return this.tween(el,a.props,a.duration||600,a.easing||'easeOutBounce'); })); }
  stop(){ if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId=null; } this.running=!1; }
  _wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
  _getTransform(el){ var t=el.getAttribute('transform'); if(!t)return{tx:0,ty:0,sx:1,sy:1,rot:0}; var tx=(t.match(/translate\(([^,]+),?\s*([^)]+)?\)/)||[]).slice(1).map(Number),sc=(t.match(/scale\(([^,]+),?\s*([^)]+)?\)/)||[]).slice(1).map(Number),rt=(t.match(/rotate\(([^)]+)\)/)||[])[1]; return{tx:tx[0]||0,ty:tx[1]||0,sx:sc[0]||1,sy:sc[1]||sc[0]||1,rot:parseFloat(rt)||0}; }
  _setTransform(el,from,to,t){ var tx=from.tx+(to.tx-from.tx)*t,ty=from.ty+(to.ty-from.ty)*t,sx=from.sx+(to.sx-from.sx)*t,sy=from.sy+(to.sy-from.sy)*t,rot=from.rot+(to.rot-from.rot)*t; el.setAttribute('transform','translate('+tx+','+ty+') scale('+sx+','+sy+') rotate('+rot+')'); }
}

    this._addBundles(svg,tens1,60,100,'orange','g-tens');
    this._addSingles(svg,ones1,60+tens1*45,100,'emerald','g-ones');
    this._addText(svg,W/2,155,'−','text-3xl font-bold','#EF4444');
    this._addText(svg,W-80,28,'拿走'+num2,'text-sm','#EF4444');
    var takeX=W-160;
    this._addBundles(svg,tens2,takeX,100,'red','g-take-tens');
    this._addSingles(svg,ones2,takeX+tens2*45,100,'red','g-take-ones');
    var resultY=320;
    this._addLine(svg,30,resultY-40,W-30,resultY-40,'#D1D5DB',1);
    this._addText(svg,W/2,resultY-20,'=','text-2xl','#9CA3AF');
    var resultText=this._addText(svg,W/2,resultY+35,'?','text-4xl font-bold','#8B5CF6','result-text');
    resultText.setAttribute('opacity','0');
    var borrowText;
    if(hasBorrow){ borrowText=this._addText(svg,50+tens1*45-20,65,'','text-xs font-bold','#EF4444','borrow-text'); borrowText.setAttribute('opacity','0'); }
    var narrationEl=this._addText(svg,W/2,H-25,'','text-sm','#6B7280','narration-text');
    var formulaEl=this._addText(svg,W/2,H-55,'','text-lg font-bold','#374151','formula-text');
    formulaEl.setAttribute('opacity','0');
    var stepIdx=0,totalSteps=steps.length;
    var runStep=function(){
      if(stepIdx>=totalSteps){ if(this.onComplete)this.onComplete(); return; }
      var step=steps[stepIdx];
      narrationEl.textContent=step.narration;
      formulaEl.textContent=step.resultText;
      formulaEl.setAttribute('opacity','1');
      if(step.highlight==='ones'){ this._highlightGroup(svg,'g-ones','#6EE7B7'); this._highlightGroup(svg,'g-take-ones','#FCA5A5'); }
      else if(step.highlight==='borrow'&&hasBorrow){ borrowText.textContent='退1→10'; borrowText.setAttribute('opacity','1'); }
      else if(step.highlight==='tens'){ this._highlightGroup(svg,'g-tens','#FB923C'); this._highlightGroup(svg,'g-take-tens','#FCA5A5'); }
      else if(step.highlight==='result'){ resultText.textContent=''+(num1-num2); resultText.setAttribute('opacity','1'); if(step.celebration&&window.confetti)window.confetti({particleCount:80,spread:70,origin:{y:0.6}}); }
      stepIdx++;
    }.bind(this);
    container._animController={runStep:runStep,totalSteps:totalSteps,getCurrentStep:function(){return stepIdx;},reset:function(){stepIdx=0;resultText.setAttribute('opacity','0');formulaEl.setAttribute('opacity','0');if(borrowText)borrowText.setAttribute('opacity','0');narrationEl.textContent='';formulaEl.textContent='';},isDone:function(){return stepIdx>=totalSteps;}};
    return container._animController;
  }

  // === 辅助绘图 ===
  _mkSVG(container,w,h){ var svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.setAttribute('width','100%'); svg.setAttribute('height','100%'); container.appendChild(svg); return svg; }
  _addLine(svg,x1,y1,x2,y2,stroke,width,dash){ var line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2); line.setAttribute('stroke',stroke); line.setAttribute('stroke-width',width); if(dash)line.setAttribute('stroke-dasharray','6,4'); svg.appendChild(line); return line; }
  _addText(svg,x,y,text,cls,fill,id){ var t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','central'); t.setAttribute('fill',fill); var fs='14'; if(cls.includes('4xl'))fs='36'; else if(cls.includes('3xl'))fs='30'; else if(cls.includes('2xl'))fs='24'; else if(cls.includes('xl'))fs='20'; else if(cls.includes('lg'))fs='18'; t.setAttribute('font-size',fs); t.setAttribute('font-family','system-ui,sans-serif'); if(cls.includes('bold'))t.setAttribute('font-weight','bold'); if(id)t.setAttribute('id',id); t.textContent=text; svg.appendChild(t); return t; }
  _addCircle(svg,cx,cy,r,fill,stroke,groupId){ var c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r); c.setAttribute('fill',fill); c.setAttribute('stroke',stroke||'#9CA3AF'); c.setAttribute('stroke-width','1'); if(groupId)c.setAttribute('data-group',groupId); svg.appendChild(c); return c; }
  _addRect(svg,x,y,w,h,fill,stroke,rx,groupId){ var rect=document.createElementNS('http://www.w3.org/2000/svg','rect'); rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',w); rect.setAttribute('height',h); rect.setAttribute('fill',fill); rect.setAttribute('stroke',stroke||'#D1D5DB'); rect.setAttribute('stroke-width','1.5'); rect.setAttribute('rx',rx||'3'); if(groupId)rect.setAttribute('data-group',groupId); svg.appendChild(rect); return rect; }
  _addBundle(svg,x,y,color,id){ var g=document.createElementNS('http://www.w3.org/2000/svg','g'); var cols={orange:'#FB923C',red:'#F87171'}; var fill=cols[color]||'#FB923C'; for(var i=0;i<10;i++){ var line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',x+i*3.5); line.setAttribute('y1',y); line.setAttribute('x2',x+i*3.5); line.setAttribute('y2',y+55); line.setAttribute('stroke',fill); line.setAttribute('stroke-width','2.5'); line.setAttribute('stroke-linecap','round'); g.appendChild(line); } var tie=document.createElementNS('http://www.w3.org/2000/svg','rect'); tie.setAttribute('x',x-3); tie.setAttribute('y',y+22); tie.setAttribute('width',38); tie.setAttribute('height',10); tie.setAttribute('fill','#FBBF24'); tie.setAttribute('rx','4'); tie.setAttribute('stroke','#D97706'); tie.setAttribute('stroke-width','1'); g.appendChild(tie); var label=document.createElementNS('http://www.w3.org/2000/svg','text'); label.setAttribute('x',x+17); label.setAttribute('y',y+70); label.setAttribute('text-anchor','middle'); label.setAttribute('font-size','12'); label.setAttribute('fill','#6B7280'); label.textContent='1捆(10根)'; g.appendChild(label); if(id)g.setAttribute('id',id); svg.appendChild(g); return g; }
  _addBundles(svg,count,startX,y,color,groupId){ for(var i=0;i<count;i++){ var bundle=this._addBundle(svg,startX+i*46,y,color); if(groupId)bundle.setAttribute('data-group',groupId); } }
  _addStick(svg,x,y,color,groupId){ var cols={emerald:'#34D399',red:'#F87171'}; var fill=cols[color]||'#34D399'; var line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',x+4); line.setAttribute('y1',y+12); line.setAttribute('x2',x+4); line.setAttribute('y2',y+62); line.setAttribute('stroke',fill); line.setAttribute('stroke-width','2.5'); line.setAttribute('stroke-linecap','round'); if(groupId)line.setAttribute('data-group',groupId); svg.appendChild(line); return line; }
  _addSingles(svg,count,startX,y,color,groupId){ for(var i=0;i<count;i++)this._addStick(svg,startX+i*12,y,color,groupId); }
  _highlightGroup(svg,groupId,color){ var els=svg.querySelectorAll('[data-group="'+groupId+'"]'); els.forEach(function(el){ var strokeEl=el; if(strokeEl.tagName==='g'){ var lines=strokeEl.querySelectorAll('line'); lines.forEach(function(l){ l.setAttribute('stroke',color); l.setAttribute('stroke-width','3'); }); } else { strokeEl.setAttribute('stroke',color); strokeEl.setAttribute('stroke-width','3'); } }); if(groupId.includes('ones')||groupId.includes('tens')){ setTimeout(function(){ els.forEach(function(el){ var strokeEl=el; if(strokeEl.tagName==='g'){ var lines=strokeEl.querySelectorAll('line'); lines.forEach(function(l){ l.removeAttribute('stroke'); l.removeAttribute('stroke-width'); }); } else { el.removeAttribute('stroke'); el.removeAttribute('stroke-width'); } }); },1000); } }
}

// === 题目引擎 ===
class QuizEngine {
  constructor(){ this.sound=new SoundEngine(); this.currentQuestion=0; this.score=0; this.questions=[]; this.onFinish=null; }
  load(questions){ this.questions=questions; this.currentQuestion=0; this.score=0; }
  renderQuestion(container,onAnswer){
    if(this.currentQuestion>=this.questions.length){ this._renderComplete(container); if(this.onFinish)this.onFinish(this.score,this.questions.length); return; }
    var q=this.questions[this.currentQuestion]; container.innerHTML='';
    var card=document.createElement('div'); card.style.cssText='background:#fff;border-radius:1rem;padding:1.5rem;border:1px solid #E5E7EB';
    // 进度
    var progDiv=document.createElement('div'); progDiv.style.cssText='display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem';
    progDiv.innerHTML='<span style="font-size:0.875rem;color:#9CA3AF">第'+(this.currentQuestion+1)+'/'+this.questions.length+'题</span><div style="flex:1;height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden"><div style="height:100%;background:linear-gradient(to right,#34D399,#10B981);border-radius:4px;transition:width 0.5s;width:'+((this.currentQuestion/this.questions.length)*100)+'%"></div></div><span style="font-size:0.875rem;color:#F59E0B;font-weight:700">⭐'+this.score+'</span>';
    card.appendChild(progDiv);
    // 题目
    var qTitle=document.createElement('h3'); qTitle.style.cssText='font-size:1.25rem;font-weight:700;color:#374151;margin-bottom:1.5rem'; qTitle.textContent=q.question; card.appendChild(qTitle);
    // 选项
    var optDiv=document.createElement('div');
    if(q.type==='choice'){
      optDiv.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:0.75rem';
      q.options.forEach(function(opt,idx){
        var btn=document.createElement('button'); btn.style.cssText='padding:1rem;font-size:1.125rem;font-weight:700;border:2px solid #E5E7EB;border-radius:0.75rem;background:#fff;cursor:pointer;transition:all 0.2s'; btn.textContent=opt;
        btn.addEventListener('click',function(){ this._handleAnswer(idx,q,optDiv,onAnswer); }.bind(this));
        optDiv.appendChild(btn);
      }.bind(this));
    } else if(q.type==='fill'){
      optDiv.style.cssText='display:flex;flex-direction:column;align-items:center;gap:1rem';
      var input=document.createElement('input'); input.type='number'; input.style.cssText='width:10rem;text-align:center;font-size:1.875rem;font-weight:700;padding:1rem;border:2px solid #D1D5DB;border-radius:0.75rem;outline:none'; input.placeholder='?';
      var subBtn=document.createElement('button'); subBtn.style.cssText='padding:0.75rem 2rem;background:#10B981;color:#fff;font-weight:700;border-radius:0.75rem;border:none;cursor:pointer;font-size:1rem'; subBtn.textContent='确认答案 ✓';
      subBtn.addEventListener('click',function(){ var val=parseInt(input.value); if(!isNaN(val))this._handleFillAnswer(val,q,optDiv,onAnswer); }.bind(this));
      input.addEventListener('keydown',function(e){ if(e.key==='Enter')subBtn.click(); });
      optDiv.appendChild(input); optDiv.appendChild(subBtn);
    }
    card.appendChild(optDiv);
    // 提示
    var hintDiv=document.createElement('div'); hintDiv.style.cssText='margin-top:1rem;text-align:center';
    var hintBtn=document.createElement('button'); hintBtn.style.cssText='font-size:0.875rem;color:#9CA3AF;background:none;border:none;cursor:pointer;padding:0.25rem 0.5rem'; hintBtn.innerHTML='💡 需要提示吗？';
    hintBtn.addEventListener('click',function(){ hintDiv.innerHTML='<p style="font-size:0.875rem;color:#D97706;background:#FFFBEB;border-radius:0.5rem;padding:0.75rem;margin-top:0.5rem">💡 '+q.hint+'</p>'; });
    hintDiv.appendChild(hintBtn); card.appendChild(hintDiv);
    container.appendChild(card);
  }
  _handleAnswer(selectedIdx,question,container,onAnswer){
    var buttons=container.querySelectorAll('button'); buttons.forEach(function(b){ b.disabled=!0; });
    var isCorrect=selectedIdx===question.answer;
    if(isCorrect){ this.score++; this.sound.correct(); buttons[selectedIdx].style.cssText='background:#D1FAE5;border-color:#10B981;color:#047857;padding:1rem;font-size:1.125rem;font-weight:700;border-radius:0.75rem'; }
    else { this.sound.incorrect(); buttons[selectedIdx].style.cssText='background:#FEE2E2;border-color:#EF4444;color:#B91C1C;padding:1rem;font-size:1.125rem;font-weight:700;border-radius:0.75rem'; buttons[question.answer].style.cssText='background:#D1FAE5;border-color:#10B981;color:#047857;padding:1rem;font-size:1.125rem;font-weight:700;border-radius:0.75rem'; }
    var explainDiv=document.createElement('div'); explainDiv.style.cssText='margin-top:1rem;padding:0.75rem;border-radius:0.5rem;font-size:0.875rem;'+(isCorrect?'background:#ECFDF5;color:#047857':'background:#FFFBEB;color:#D97706'); explainDiv.textContent=(isCorrect?'✅ 答对了！':'❌ 再想想～')+' '+question.explanation; container.appendChild(explainDiv);
    var nextBtn=document.createElement('button'); nextBtn.style.cssText='margin-top:1rem;width:100%;padding:0.5rem;background:#F3F4F6;color:#4B5563;font-weight:700;border-radius:0.75rem;border:none;cursor:pointer'; nextBtn.textContent=this.currentQuestion+1>=this.questions.length?'查看结果 →':'下一题 →';
    nextBtn.addEventListener('click',function(){ this.currentQuestion++; if(onAnswer)onAnswer(); }.bind(this)); container.appendChild(nextBtn);
  }
  _handleFillAnswer(val,question,container,onAnswer){
    var correctAnswer=parseInt(question.answer),isCorrect=val===correctAnswer;
    if(isCorrect){ this.score++; this.sound.correct(); } else this.sound.incorrect();
    var resultDiv=document.createElement('div'); resultDiv.style.cssText='margin-top:0.75rem;padding:0.75rem;border-radius:0.5rem;text-align:center;font-size:0.875rem;'+(isCorrect?'background:#ECFDF5;color:#047857':'background:#FFFBEB;color:#D97706'); resultDiv.innerHTML=isCorrect?'✅ 答对了！'+question.explanation:'❌ 答案是<b>'+correctAnswer+'</b>。'+question.explanation; container.appendChild(resultDiv);
    var inp=container.querySelector('input'),sb=container.querySelector('button'); if(inp)inp.disabled=!0; if(sb)sb.style.display='none';
    var nextBtn=document.createElement('button'); nextBtn.style.cssText='margin-top:0.75rem;width:100%;padding:0.5rem;background:#F3F4F6;color:#4B5563;font-weight:700;border-radius:0.75rem;border:none;cursor:pointer'; nextBtn.textContent=this.currentQuestion+1>=this.questions.length?'查看结果 →':'下一题 →';
    nextBtn.addEventListener('click',function(){ this.currentQuestion++; if(onAnswer)onAnswer(); }.bind(this)); container.appendChild(nextBtn);
  }
  _renderComplete(container){
    var pct=Math.round((this.score/this.questions.length)*100),stars=pct>=90?3:pct>=60?2:1;
    var msgs={3:{title:'太棒了！🌟',desc:'你全部掌握了！',color:'#10B981'},2:{title:'做得不错！👍',desc:'再加把劲就更好了！',color:'#F59E0B'},1:{title:'继续加油！💪',desc:'多练习几次就会了！',color:'#F97316'}};
    var m=msgs[stars];
    container.innerHTML='<div style="text-align:center;padding:2rem"><div style="font-size:3.75rem;margin-bottom:1rem">'+(stars===3?'🏆':stars===2?'🌟':'💪')+'</div><h2 style="font-size:1.5rem;font-weight:700;color:'+m.color+';margin-bottom:0.5rem">'+m.title+'</h2><p style="color:#6B7280;margin-bottom:0.5rem">'+m.desc+'</p><div style="display:flex;justify-content:center;gap:0.25rem;margin-bottom:1rem">'+[1,2,3].map(function(i){return'<span style="font-size:1.875rem;'+(i<=stars?'':'opacity:0.3')+'">⭐</span>';}).join('')+'</div><p style="font-size:1.125rem;font-weight:700;color:#374151">正确率: <span style="color:'+m.color+'">'+pct+'%</span> ('+this.score+'/'+this.questions.length+')</p></div>';
    if(stars>=2)this.sound.complete(); if(stars===3&&window.confetti)window.confetti({particleCount:150,spread:100,origin:{y:0.6}});
  }
  getScore(){return this.score;} getTotal(){return this.questions.length;}
  getStars(){var pct=Math.round((this.score/this.questions.length)*100); return pct>=90?3:pct>=60?2:1;}
  reset(){this.currentQuestion=0;this.score=0;}
}

document.getElementById('load-status').textContent = '引擎就绪...';
</script>

<!-- ===== 应用层 (app.js 内联) ===== -->
<script>
document.getElementById('load-status').textContent = '正在初始化应用...';
/**
 * math-adventure/app.js — 路由 + 状态管理 + 页面渲染
 */
const App = {
  state: { gradeId: null, unitId: null, lessonId: null, mode: 'grades', currentStep: 0 },
  sceneRenderer: null, quizEngine: null, animController: null, progress: null,

  init() {
    try {
      this.sceneRenderer = new SVGSceneRenderer();
      this.quizEngine = new QuizEngine();
      this.progress = this._loadProgress();
      window.addEventListener('hashchange', () => { try { this._route(); } catch(e) { console.error(e); } });
      this._route();
      document.getElementById('load-status').textContent = '✓ 加载完成！';
      setTimeout(() => {
        var ls = document.getElementById('loading-screen');
        if (ls) ls.style.display = 'none';
      }, 500);
    } catch(e) {
      console.error('App init error:', e);
      document.getElementById('load-status').textContent = '❌ 初始化失败: ' + e.message;
      document.getElementById('error-display').style.display = 'block';
      document.getElementById('error-display').textContent = '错误: ' + e.message;
    }
  },

  _loadProgress() {
    try { var raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
    return JSON.parse(JSON.stringify(DEFAULT_PROGRESS));
  },

  _saveProgress() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.progress)); } catch(e) {} },

  _markLessonComplete(lessonId, stars) {
    if (!this.progress.lessons[lessonId]) this.progress.lessons[lessonId] = {};
    var lesson = this.progress.lessons[lessonId];
    lesson.completed = true; lesson.stars = Math.max(lesson.stars || 0, stars);
    lesson.completedAt = new Date().toISOString().split('T')[0];
    var today = new Date().toISOString().split('T')[0];
    if (this.progress.lastStudyDate !== today) {
      var yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      if (this.progress.lastStudyDate === yesterday) this.progress.streak = (this.progress.streak || 0) + 1;
      else this.progress.streak = 1;
      this.progress.lastStudyDate = today;
    }
    this.progress.stars += stars;
    this._saveProgress();
  },

  _route() {
    var hash = window.location.hash.replace('#/', '').replace('#', '');
    var parts = hash.split('/').filter(Boolean);
    if (parts.length === 0) { this.state.mode = 'grades'; this._renderGrades(); }
    else if (parts[0] === 'grade' && parts.length >= 2) {
      this.state.gradeId = parts[1];
      if (parts.length === 2) { this.state.mode = 'units'; this._renderUnits(); }
      else if (parts[2] === 'unit' && parts.length >= 4) {
        this.state.unitId = parts[3];
        if (parts.length === 4) this._renderLessonList();
        else if (parts[4] === 'lesson' && parts.length >= 6) {
          this.state.lessonId = parts[5];
          if (parts[6] === 'quiz') { this.state.mode = 'quiz'; this._renderQuiz(); }
          else { this.state.mode = 'animation'; this._renderAnimation(); }
        }
      }
    }
  },

  _navigate(path) { window.location.hash = '#' + path; },

  _renderGrades() {
    this.state.mode = 'grades';
    var main = document.getElementById('main-content');
    var grades = MATH_DATA.grades;
    var cards = Object.entries(grades).map(function(entry) {
      var id = entry[0], g = entry[1];
      var isUnlocked = parseInt(id) <= 3;
      return '<div class="cursor-pointer bg-white rounded-3xl p-6 shadow" style="'+(isUnlocked?'cursor:pointer;background:#fff;border:2px solid #A7F3D0':'cursor:not-allowed;opacity:0.6;background:#fff;border:2px solid #E5E7EB')+';border-radius:1.5rem;padding:1.5rem;transition:all 0.3s"' + (isUnlocked ? ' onclick="App._navigate(\'grade/'+id+'\')"' : '') + '><div class="text-center" style="text-align:center"><div style="font-size:3rem;margin-bottom:0.75rem">'+g.mascot+'</div><div style="display:inline-block;padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.875rem;font-weight:700;background:#D1FAE5;color:#059669;margin-bottom:0.5rem">'+g.name+'</div><p style="font-size:0.875rem;color:#9CA3AF">'+g.subtitle+'</p>' + (isUnlocked ? '' : '<div style="margin-top:0.75rem"><span style="font-size:1.5rem;color:#D1D5DB">🔒</span></div>') + '</div></div>';
    }).join('');
    main.innerHTML = '<div class="max-w-4xl mx-auto" style="max-width:896px;margin:0 auto"><div class="text-center mb-10" style="text-align:center;margin-bottom:2.5rem"><h1 style="font-size:2.25rem;font-weight:700;background:linear-gradient(to right,#10B981,#14B8A6,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:0.5rem">🌟 数学探险之旅</h1><p style="color:#9CA3AF;font-size:1.125rem">和吉祥物一起探索有趣的数学世界</p></div><div class="grid grid-cols-2 md:grid-cols-3 gap-5" style="display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem">'+cards+'</div>'+(this.progress.stars>0?'<div class="mt-8 text-center" style="margin-top:2rem;text-align:center"><div style="display:inline-flex;align-items:center;gap:0.75rem;background:#fff;border-radius:1rem;padding:0.75rem 1.5rem;border:1px solid #E5E7EB"><span style="font-size:1.5rem">⭐</span><span style="font-size:1.125rem;font-weight:700;color:#374151">共获得 '+this.progress.stars+' 颗星</span></div></div>':'')+'</div>';
  },

  _renderUnits() {
    var main = document.getElementById('main-content');
    var grade = MATH_DATA.grades[this.state.gradeId];
    if (!grade || grade.locked) return this._renderGrades();
    var units = grade.units.map(function(u) {
      var isLocked = u.locked;
      return '<div class="bg-white rounded-2xl p-5 shadow" style="'+(isLocked?'opacity:0.6;cursor:not-allowed;':'cursor:pointer;')+'background:#fff;border-radius:1rem;padding:1.25rem;border:2px solid '+(isLocked?'#E5E7EB':'#FED7AA')+';transition:all 0.3s" '+(isLocked?'':'onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+u.id+'\')"')+'><div class="flex items-center gap-3" style="display:flex;align-items:center;gap:0.75rem"><div style="width:3rem;height:3rem;border-radius:0.75rem;background:#FFF7ED;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#F97316">'+(u.icon==='fa-ruler'?'📏':u.icon==='fa-draw-polygon'?'📐':u.icon==='fa-xmark'?'✖️':u.icon==='fa-table'?'🔢':u.icon==='fa-clock'?'🕐':u.icon==='fa-divide'?'➗':u.icon==='fa-chart-bar'?'📊':u.icon==='fa-plus-minus'?'➕':'📖')+'</div><div><h3 style="font-weight:700;color:#374151">'+u.name+'</h3><p style="font-size:0.75rem;color:#9CA3AF">'+(isLocked?'🔒 即将开放':'点击进入学习')+'</p></div></div></div>';
    }.bind(this)).join('');
    main.innerHTML = '<div class="max-w-2xl mx-auto" style="max-width:672px;margin:0 auto"><div class="flex items-center gap-3 mb-6" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem"><button onclick="App._navigate(\'\')" style="width:2.5rem;height:2.5rem;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:1px solid #E5E7EB;padding:0;font-size:1rem;cursor:pointer">←</button><div><h1 style="font-size:1.5rem;font-weight:700;color:#374151">'+grade.name+' '+grade.mascot+'</h1><p style="font-size:0.875rem;color:#9CA3AF">'+grade.subtitle+' · '+grade.mascotName+'陪你学</p></div></div><div class="space-y-3">'+units+'</div></div>';
  },

  _renderLessonList() {
    var main = document.getElementById('main-content');
    var grade = MATH_DATA.grades[this.state.gradeId];
    var unit = grade && grade.units.find(function(u) { return u.id === this.state.unitId; }.bind(this));
    if (!unit || unit.locked) return this._renderUnits();
    var lessons = unit.lessons.map(function(l, idx) {
      var prog = this.progress.lessons[l.id];
      var completed = prog && prog.completed;
      var stars = prog ? prog.stars || 0 : 0;
      return '<div class="bg-white rounded-2xl p-5 shadow cursor-pointer" style="background:#fff;border-radius:1rem;padding:1.25rem;border:2px solid #E5E7EB;transition:all 0.3s;cursor:pointer" onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+this.state.unitId+'/lesson/'+l.id+'\')"><div class="flex items-center gap-4" style="display:flex;align-items:center;gap:1rem"><div style="width:2.5rem;height:2.5rem;border-radius:9999px;'+(completed?'background:#D1FAE5;color:#10B981':'background:#FFF7ED;color:#F97316')+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.875rem">'+(idx+1)+'</div><div class="flex-1" style="flex:1"><h3 style="font-weight:700;color:#374151">'+l.title+'</h3><p style="font-size:0.875rem;color:#9CA3AF">'+l.subtitle+'</p></div><div style="text-align:right">'+(completed?'<div style="display:flex;gap:0.125rem">'+[1,2,3].map(function(i){return '<span style="'+(i<=stars?'':'opacity:0.3')+'">⭐</span>';}).join('')+'</div>':'<span style="font-size:0.75rem;color:#D1D5DB">未学习</span>')+'</div></div></div>';
    }.bind(this)).join('');
    main.innerHTML = '<div class="max-w-2xl mx-auto" style="max-width:672px;margin:0 auto"><div class="flex items-center gap-3 mb-6" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem"><button onclick="App._navigate(\'grade/'+this.state.gradeId+'\')" style="width:2.5rem;height:2.5rem;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:1px solid #E5E7EB;padding:0;font-size:1rem;cursor:pointer">←</button><div><h1 style="font-size:1.5rem;font-weight:700;color:#374151">'+unit.name+'</h1><p style="font-size:0.875rem;color:#9CA3AF">共 '+unit.lessons.length+' 个课时</p></div></div><div class="space-y-3">'+lessons+'</div></div>';
  },

  _renderAnimation() {
    var main = document.getElementById('main-content');
    var grade = MATH_DATA.grades[this.state.gradeId];
    var unit = grade && grade.units.find(function(u) { return u.id === this.state.unitId; }.bind(this));
    var lesson = unit && unit.lessons.find(function(l) { return l.id === this.state.lessonId; }.bind(this));
    if (!lesson) return this._renderLessonList();
    this.state.currentStep = 0;
    if (this.animController) this.animController.reset();

    main.innerHTML = '<div class="max-w-3xl mx-auto" style="max-width:768px;margin:0 auto"><div class="flex items-center justify-between mb-4" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem"><button onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+this.state.unitId+'\')" style="width:2.5rem;height:2.5rem;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:1px solid #E5E7EB;padding:0;font-size:1rem;cursor:pointer">←</button><div class="text-center" style="text-align:center"><h1 style="font-size:1.25rem;font-weight:700;color:#374151">'+lesson.title+'</h1><p style="font-size:0.75rem;color:#9CA3AF">'+lesson.subtitle+'</p></div><button id="btn-replay" style="width:2.5rem;height:2.5rem;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:1px solid #E5E7EB;padding:0;font-size:1rem;cursor:pointer">🔄</button></div><div style="background:#FFFBEB;border-radius:1rem;padding:1rem;margin-bottom:1rem;text-align:center;border:1px solid #FDE68A"><p style="color:#D97706"><span style="font-size:1.5rem;margin-right:0.5rem">📖</span>'+lesson.sceneConfig.story+'</p></div><div id="svg-scene" style="background:#fff;border-radius:1rem;padding:1rem;margin-bottom:1rem;border:1px solid #E5E7EB;min-height:360px"></div><div style="background:#fff;border-radius:1rem;padding:1rem;margin-bottom:1rem;border:1px solid #E5E7EB;text-align:center"><p style="font-size:1.125rem;color:#4B5563" id="narration-display">点击"下一步"开始动画</p><p style="font-size:1.25rem;font-weight:700;color:#F97316;margin-top:0.25rem" id="formula-display"></p><p style="font-size:0.75rem;color:#9CA3AF;margin-top:0.5rem" id="step-counter">步骤 0/'+lesson.sceneConfig.steps.length+'</p></div><div class="flex justify-center gap-3" style="display:flex;justify-content:center;gap:0.75rem"><button id="btn-prev" disabled style="padding:0.75rem 1.5rem;background:#F3F4F6;color:#6B7280;border-radius:0.75rem;font-weight:700;border:none;cursor:pointer;opacity:0.4">◀ 上一步</button><button id="btn-next" style="padding:0.75rem 2rem;background:linear-gradient(to right,#34D399,#10B981);color:#fff;border-radius:0.75rem;font-weight:700;border:none;cursor:pointer">下一步 ▶</button></div><div id="post-animation-area" class="mt-6 text-center hidden" style="margin-top:1.5rem;text-align:center;display:none"><button onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+this.state.unitId+'/lesson/'+this.state.lessonId+'/quiz\')" style="padding:0.75rem 2rem;background:linear-gradient(to right,#F59E0B,#F97316);color:#fff;border-radius:0.75rem;font-weight:700;border:none;cursor:pointer;font-size:1.125rem">✨ 开始练习 ✨</button></div></div>';

    var sceneContainer = document.getElementById('svg-scene');
    this.animController = this.sceneRenderer.render(sceneContainer, lesson.sceneType, lesson.sceneConfig, function() {
      document.getElementById('btn-next').disabled = true;
      document.getElementById('btn-prev').disabled = true;
      document.getElementById('post-animation-area').style.display = 'block';
      document.getElementById('step-counter').textContent = '🎉 讲解完成！';
      document.getElementById('narration-display').textContent = '你已经理解了这个知识点，来做几道练习巩固一下吧！';
    });

    this._syncNarration(lesson);

    var btnNext = document.getElementById('btn-next');
    var btnPrev = document.getElementById('btn-prev');
    var btnReplay = document.getElementById('btn-replay');

    btnNext.addEventListener('click', function() {
      if (this.animController) {
        this.animController.runStep();
        this.state.currentStep++;
        this._syncNarration(lesson);
        if (this.state.currentStep > 0) btnPrev.disabled = false;
        if (this.state.currentStep >= this.animController.totalSteps) btnNext.disabled = true;
      }
    }.bind(this));

    btnPrev.addEventListener('click', function() {
      var sc = document.getElementById('svg-scene');
      this.animController = this.sceneRenderer.render(sc, lesson.sceneType, lesson.sceneConfig, function() {
        document.getElementById('btn-next').disabled = true;
        document.getElementById('post-animation-area').style.display = 'block';
      });
      this.state.currentStep = 0;
      btnPrev.disabled = true;
      btnNext.disabled = false;
      document.getElementById('post-animation-area').style.display = 'none';
      this._syncNarration(lesson);
    }.bind(this));

    btnReplay.addEventListener('click', function() {
      var sc = document.getElementById('svg-scene');
      this.animController = this.sceneRenderer.render(sc, lesson.sceneType, lesson.sceneConfig, function() {
        document.getElementById('btn-next').disabled = true;
        document.getElementById('post-animation-area').style.display = 'block';
        document.getElementById('step-counter').textContent = '🎉 讲解完成！';
        document.getElementById('narration-display').textContent = '你已经理解了这个知识点，来做几道练习巩固一下吧！';
      });
      this.state.currentStep = 0;
      btnPrev.disabled = true;
      btnNext.disabled = false;
      document.getElementById('post-animation-area').style.display = 'none';
      this._syncNarration(lesson);
    }.bind(this));
  },

  _syncNarration(lesson) {
    var narrationEl = document.getElementById('narration-display');
    var formulaEl = document.getElementById('formula-display');
    var counterEl = document.getElementById('step-counter');
    if (!narrationEl || !counterEl) return;
    var totalSteps = lesson.sceneConfig.steps.length;
    if (this.state.currentStep === 0) {
      narrationEl.textContent = '点击"下一步"开始动画';
      if (formulaEl) formulaEl.textContent = '';
      counterEl.textContent = '步骤 0/' + totalSteps;
    } else if (this.state.currentStep <= totalSteps) {
      var step = lesson.sceneConfig.steps[this.state.currentStep - 1];
      narrationEl.textContent = step.narration;
      if (formulaEl) formulaEl.textContent = step.resultText || '';
      counterEl.textContent = '步骤 ' + this.state.currentStep + '/' + totalSteps;
    }
  },

  _renderQuiz() {
    var main = document.getElementById('main-content');
    var grade = MATH_DATA.grades[this.state.gradeId];
    var unit = grade && grade.units.find(function(u) { return u.id === this.state.unitId; }.bind(this));
    var lesson = unit && unit.lessons.find(function(l) { return l.id === this.state.lessonId; }.bind(this));
    if (!lesson) return this._renderLessonList();
    this.quizEngine.load(lesson.exercises);
    this.quizEngine.onFinish = function(score, total) {
      var stars = this.quizEngine.getStars();
      this._markLessonComplete(this.state.lessonId, stars);
      setTimeout(function() {
        var qc = document.getElementById('quiz-container');
        if (qc) {
          var backDiv = document.createElement('div');
          backDiv.style.cssText = 'text-align:center;margin-top:1.5rem';
          backDiv.innerHTML = '<button onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+this.state.unitId+'\')" style="padding:0.75rem 2rem;background:linear-gradient(to right,#34D399,#10B981);color:#fff;border-radius:0.75rem;font-weight:700;border:none;cursor:pointer">← 返回课时列表</button><br><button onclick="App.quizEngine.reset(); App._renderQuiz();" style="padding:0.5rem 1.5rem;color:#F59E0B;background:none;border:none;cursor:pointer;font-size:0.875rem;margin-top:0.5rem">🔄 重新练习</button>';
          qc.appendChild(backDiv);
        }
      }.bind(this), 100);
    }.bind(this);
    main.innerHTML = '<div class="max-w-lg mx-auto" style="max-width:512px;margin:0 auto"><div class="flex items-center gap-3 mb-4" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem"><button onclick="App._navigate(\'grade/'+this.state.gradeId+'/unit/'+this.state.unitId+'/lesson/'+this.state.lessonId+'\')" style="width:2.5rem;height:2.5rem;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:1px solid #E5E7EB;padding:0;font-size:1rem;cursor:pointer">←</button><div><h1 style="font-size:1.25rem;font-weight:700;color:#374151">📝 '+lesson.title+' — 练习</h1><p style="font-size:0.75rem;color:#9CA3AF">共 '+lesson.exercises.length+' 题，加油！</p></div></div><div id="quiz-container"></div></div>';
    var quizContainer = document.getElementById('quiz-container');
    var renderNext = function() { this.quizEngine.renderQuestion(quizContainer, renderNext); }.bind(this);
    renderNext();
  }
};

document.addEventListener('DOMContentLoaded', function() { App.init(); });
document.getElementById('load-status').textContent = '应用逻辑就绪，等待 DOM 就绪...';
</script>

</body>
</html>
