<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>设计师妈妈的服装实验室 · PM</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏳%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- 顶栏：项目名 + 角色切换 + 声音档开关 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">⏳</span>
      <div>
        <div class="title">服装实验室 · PM</div>
        <div class="subtitle" id="subtitle">M1 破冰期 · 启动倒计时 12 天</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="role-toggle" id="roleToggle" title="切换视角">
        <span class="role-icon">🔧</span>
        <span class="role-label" id="roleLabel">杨珂</span>
      </button>
      <button class="audio-toggle" id="audioToggle" title="声音档模式">
        🎙️
      </button>
    </div>
  </header>

  <!-- 主体内容 -->
  <main id="main" class="main">
    <div class="loading">加载中…</div>
  </main>

  <!-- 底部导航：9 屏 -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home">🏠<span>主页</span></button>
    <button class="nav-item" data-view="calendar">📅<span>日历</span></button>
    <button class="nav-item" data-view="topics">🔬<span>选题</span></button>
    <button class="nav-item" data-view="review">📊<span>复盘</span></button>
    <button class="nav-item" data-view="gear">🛒<span>设备</span></button>
    <button class="nav-item" data-view="finance">💰<span>财务</span></button>
    <button class="nav-item" data-view="moat">🛡️<span>护城河</span></button>
    <button class="nav-item" data-view="scripts">💬<span>声音档</span></button>
    <button class="nav-item" data-view="docs">📚<span>资料</span></button>
  </nav>

  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
