services:
  - type: web
    name: xiaohongshu-tools
    env: node
    plan: free
    rootDir: xiaohongshu-tools-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_MODE
        value: "true"
