<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>两宝家庭好物实验室 V2.1 · AI运营系统</title>
<style>
:root{--card:#fffaf3;--ink:#2c261f;--muted:#7a6b5c;--line:#eadccc;--brand:#b8734a;--green:#426b55;--red:#b84a4a;--yellow:#b9822d;--shadow:0 14px 36px rgba(74,50,27,.10);--r:18px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#faf6ee,#f0e6d8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:9;background:rgba(255,250,243,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#d69a70,#426b55);box-shadow:var(--shadow);font-size:23px}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);font-weight:700}.btn:hover{transform:translateY(-1px);border-color:#d2bda6}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.red{color:var(--red);border-color:#e5b4b4}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 77px)}nav{padding:18px;border-right:1px solid var(--line);background:rgba(255,250,243,.55)}nav button{display:flex;width:100%;gap:10px;border:0;background:transparent;padding:12px;border-radius:14px;cursor:pointer;color:var(--muted);font-weight:800;text-align:left}nav button.active,nav button:hover{background:white;color:var(--ink);box-shadow:0 8px 22px rgba(74,50,27,.08)}main{padding:22px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:rgba(255,250,243,.86);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:16px}.stat .n{font-size:28px;font-weight:950}.stat .l{color:var(--muted);font-size:13px}.panel{padding:18px;margin-top:16px}h2{font-size:18px;margin:0 0 12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}input,select,textarea{border:1px solid var(--line);border-radius:12px;padding:10px;background:white;font:inherit;color:var(--ink)}textarea{width:100%;min-height:98px;resize:vertical}.search{min-width:240px}.tablewrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:white}table{border-collapse:collapse;width:100%;min-width:1120px}th,td{border-bottom:1px solid #f0e5d9;padding:10px 12px;text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#fbf4eb;color:#675745}tr:hover td{background:#fffdfa}.tag{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#f2e6d8;color:#6a5542}.tag.ok{background:#e2f1e7;color:#337349}.tag.warn{background:#fff0d4;color:var(--yellow)}.tag.bad{background:#fae1e1;color:var(--red)}.rowbtn{border:0;background:#f1e5d7;border-radius:9px;padding:6px 8px;cursor:pointer;margin:2px}.rowbtn:hover{background:#e5d2bd}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(35,28,22,.48);z-index:30;display:grid;place-items:center;padding:18px}.dialog{width:min(980px,96vw);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.dialog h3{margin:0 0 14px}.dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}.hidden{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px}.col{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.col h3{font-size:15px;margin:0 0 8px}.card{background:#fffaf3;border:1px solid #efdfce;border-radius:14px;padding:11px;margin:9px 0}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.score{height:9px;border-radius:999px;background:#eadccc;overflow:hidden;margin-top:5px}.score i{display:block;height:100%;background:linear-gradient(90deg,#d89b6f,#426b55)}.prompt{white-space:pre-wrap;background:#2d261f;color:#fff8ee;border-radius:16px;padding:14px;line-height:1.65;min-height:150px}.notice{border-left:4px solid var(--brand);background:white;border-radius:14px;padding:12px;margin:10px 0}.toast{position:fixed;right:20px;bottom:20px;background:#2d261f;color:white;border-radius:14px;padding:12px 16px;z-index:60;box-shadow:var(--shadow)}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:132px}.grid{grid-template-columns:repeat(2,1fr)}.two,.formgrid{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><div class="logo">🏠</div><div><h1>两宝家庭好物实验室 V2.1 · AI运营系统</h1><div class="sub">V2.1：安全转义、数据校验、备份提醒、样品转内容草稿、曼曼语音工作流、自动决策建议。</div></div></div><div class="actions"><button class="btn green" onclick="exportJSON()">导出备份</button><label class="btn">导入备份<input type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></label><button class="btn" onclick="exportCSV()">导出CSV</button><button class="btn red" onclick="resetDemo()">恢复示例</button></div></div></header>
<div class="layout"><nav id="nav"></nav><main id="app"></main></div><div id="toast" class="toast hidden"></div>
<script>
const SCHEMA=21, KEY='liangbao_goodies_v21', OLD_KEYS=['liangb…s_v2','liangbao-goodies-system-v2','liangb…m_v1'];
const tabs=[['dashboard','总览','📊'],['products','商品候选池','🧺'],['samples','样品测试','🧪'],['content','内容策划','📝'],['orders','订单毛利','💰'],['review','周复盘','🔁'],['ai','AI工作台','🤖']];
function today(){return new Date().toISOString().slice(0,10)}function daysBetween(a,b=today()){if(!a)return 999;return Math.floor((new Date(b)-new Date(a))/(864e5))}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function attr(v){return esc(v)}
const seed={schemaVersion:SCHEMA,meta:{createdAt:today(),lastBackupAt:'',project:'两宝家庭好物实验室'},products:[{id:'P001',name:'厨房湿巾',cat:'清洁',source:'1688',link:'',samplePrice:29,supplyPrice:18,shipping:6,price:39,dropship:'是',shipFrom:'江浙沪',moq:'1',risk:'低',display:5,repurchase:4,manman:4,status:'候选',reason:'家庭痛点强，适合前后对比，小红书内容好写。',note:'注意味道、厚度、是否掉絮。',created:today()},{id:'P002',name:'儿童书桌收纳盒',cat:'收纳',source:'1688',link:'',samplePrice:35,supplyPrice:22,shipping:8,price:49,dropship:'是',shipFrom:'浙江',moq:'1',risk:'低',display:5,repurchase:3,manman:5,status:'买样',reason:'孩子书桌场景真实，适合低年级家庭。',note:'注意尺寸，避免买小。',created:today()},{id:'P003',name:'奖励贴纸',cat:'亲子文具',source:'1688',link:'',samplePrice:12,supplyPrice:5,shipping:4,price:19,dropship:'是',shipFrom:'广东',moq:'1',risk:'低',display:4,repurchase:4,manman:4,status:'测试中',reason:'亲子互动强，适合做一周真实测试。',note:'不要夸大教育效果。',created:today()}],samples:[{id:'S001',pid:'P002',date:today(),scene:'儿童书桌整理',pros:'分格清楚，孩子容易拿取，桌面视觉上清爽。',cons:'太小号不够放试卷，建议先量尺寸。',photos:'待补使用前后对比',score:4,kids:'愿意自己放笔，但需要提醒。',voice:'',recommend:'是',status:'测试中'}],content:[{id:'C001',pid:'P001',title:'家有两宝后，我发现厨房湿巾不是智商税',date:'',type:'图文',views:0,likes:0,saves:0,comments:0,dms:0,askLink:0,status:'草稿',note:'保留缺点：长期大量用成本高。'}],orders:[],reviews:[]};
function normalize(d){d=d&&typeof d==='object'?d:{};let out={...structuredClone(seed),...d};out.meta={...seed.meta,...(d.meta||{})};['products','samples','content','orders','reviews'].forEach(k=>out[k]=Array.isArray(d[k])?d[k]:[]);out.schemaVersion=SCHEMA;out.products.forEach((p,i)=>{p.id=p.id||uidRaw('P',i);p.status=p.status||'候选';p.risk=p.risk||'低';p.created=p.created||today()});out.samples.forEach((s,i)=>{s.id=s.id||uidRaw('S',i);s.status=s.status||'测试中';s.voice=s.voice||''});out.content.forEach((c,i)=>{c.id=c.id||uidRaw('C',i);c.status=c.status||'草稿'});return out}function uidRaw(p,i){return p+String(i+1).padStart(3,'0')}
function load(){try{let raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw){let d=normalize(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(d));return d}}}catch(e){console.warn(e)}return structuredClone(seed)}let data=load(),current='dashboard';
function persist(silent=false){localStorage.setItem(KEY,JSON.stringify(data));render();if(!silent)toast('已保存')}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1600)}function money(n){return '¥'+(Number(n)||0).toFixed(2)}function margin(o){const p=Number(o.price)||0;return p?((p-(Number(o.supplyPrice)||0)-(Number(o.shipping)||0))/p*100):0}function riskPenalty(r){return r==='高'?25:r==='中'?12:0}function productScore(o){let m=Math.max(0,Math.min(35,margin(o)));return Math.round(m+(Number(o.display)||0)*6+(Number(o.repurchase)||0)*5+(Number(o.manman)||0)*6-riskPenalty(o.risk))}function contentScore(o){const v=Number(o.views)||1;return Math.round(((Number(o.saves)||0)*5+(Number(o.comments)||0)*4+(Number(o.dms)||0)*6+(Number(o.askLink)||0)*10+(Number(o.likes)||0)*1)/v*1000)}function productDecision(p){const s=productScore(p),m=margin(p);if(p.risk==='高')return '建议淘汰/谨慎';if(s>=75&&m>=25)return '推荐上架/放大';if(s>=60)return '推荐买样/继续测';if(s>=45)return '谨慎观察';return '建议淘汰'}function uid(prefix,arr){let n=arr.length+1,id;do{id=prefix+String(n++).padStart(3,'0')}while(arr.some(x=>x.id===id));return id}
function renderNav(){nav.innerHTML=tabs.map(t=>`<button class="${current===t[0]?'active':''}" onclick="current='${t[0]}';render()"><span>${t[2]}</span>${t[1]}</button>`).join('')}function render(){renderNav();({dashboard,products,samples,content,orders,review,ai}[current])()}
function dashboard(){let profit=data.orders.reduce((s,o)=>s+(Number(o.profit)||0),0),reminders=getReminders();app.innerHTML=`<div class="grid"><div class="stat"><div class="n">${data.products.length}</div><div class="l">候选商品</div></div><div class="stat"><div class="n">${data.samples.length}</div><div class="l">样品测试</div></div><div class="stat"><div class="n">${data.content.length}</div><div class="l">内容笔记</div></div><div class="stat"><div class="n">${money(profit)}</div><div class="l">累计毛利</div></div></div><section class="panel"><h2>工作流提醒</h2>${reminders.length?reminders.map(x=>`<div class="notice">${x}</div>`).join(''):'<p class="muted">暂无提醒。今天可以继续找货、测试或整理曼曼的试用反馈。</p>'}</section><section class="panel"><h2>商品状态看板</h2>${kanban()}</section><div class="two"><section class="panel"><h2>V2.1新增能力</h2><ul><li>数据版本号和旧版数据迁移。</li><li>导入 JSON 校验、显示安全转义。</li><li>备份提醒和带日期备份文件名。</li><li>样品一键生成内容草稿。</li><li>曼曼语音反馈 → 小红书笔记提示词。</li><li>商品决策建议：推荐买样/谨慎/淘汰/上架。</li></ul></section><section class="panel"><h2>项目边界</h2><p>不面对熟人、不露脸、不囤大货、不租仓、不碰冷链/药品/保健品/高价电器。第一版先跑通闭环。</p><p class="small">数据保存在当前浏览器本地；远程多设备同步需 V4 云端版。</p></section></div>`}
function getReminders(){let r=[];if(daysBetween(data.meta.lastBackupAt)>=7)r.push(`💾 距离上次备份已 ${daysBetween(data.meta.lastBackupAt)} 天：建议点“导出备份”，保存 JSON 文件。`);data.products.filter(p=>p.status==='候选').forEach(p=>r.push(`🧺 商品「${esc(p.name)}」仍在候选池：请让曼曼判断是否买样，或直接淘汰。`));data.samples.filter(s=>s.status==='完成'&&!data.content.some(c=>c.pid===s.pid)).forEach(s=>r.push(`🧪 样品「${esc(s.pid)}」已完成测试，但还没有对应内容草稿。`));data.content.filter(c=>Number(c.askLink)>0&&c.status!=='表现好').forEach(c=>r.push(`📝 笔记「${esc(c.title)}」已有 ${Number(c.askLink)} 人问链接：可评估是否上架/补充购买方式。`));return r.slice(0,8)}
function kanban(){const states=['候选','买样','测试中','上架','淘汰'];return `<div class="kanban">${states.map(st=>`<div class="col"><h3>${st}</h3>${data.products.filter(p=>p.status===st).map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="small">${esc(p.cat)} · 毛利率 ${margin(p).toFixed(0)}% · 评分 ${productScore(p)}</div><div class="score"><i style="width:${Math.min(100,Math.max(0,productScore(p)))}%"></i></div><span class="tag ${p.risk==='低'?'ok':p.risk==='中'?'warn':'bad'}">${esc(productDecision(p))}</span></div>`).join('')||'<div class="small">暂无</div>'}</div>`).join('')}</div>`}
function tablePage(key,title,fields,heads,extra=''){app.innerHTML=`<section class="panel"><h2>${title}</h2><div class="toolbar"><input class="search" id="q" placeholder="搜索..." oninput="filterRows()"><button class="btn primary" onclick="openForm('${key}')">新增</button>${extra}</div><div class="tablewrap"><table id="tbl"><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}<th>操作</th></tr></thead><tbody>${data[key].map((r,i)=>`<tr>${fields.map(f=>`<td>${fmt(cellValue(key,r,f))}</td>`).join('')}<td>${rowActions(key,i)}</td></tr>`).join('')}</tbody></table></div></section>`}
function rowActions(k,i){let a=`<button class="rowbtn" onclick="openForm('${k}',${i})">编辑</button><button class="rowbtn" onclick="copyAI('${k}',${i})">AI</button>`;if(k==='samples')a+=`<button class="rowbtn" onclick="sampleToContent(${i})">转内容</button>`;return a+`<button class="rowbtn" onclick="delRow('${k}',${i})">删除</button>`}
function products(){tablePage('products','商品候选池',['id','name','cat','price','supplyPrice','shipping','_margin','risk','display','repurchase','manman','_score','_decision','status'],['编号','商品','品类','售价','供货','运费','毛利率','风险','展示','复购','曼曼','评分','决策建议','状态'],'<button class="btn" onclick="sortProducts()">按评分排序</button>')}
function samples(){tablePage('samples','样品测试记录',['id','pid','date','scene','pros','cons','photos','score','kids','recommend','status'],['编号','商品编号','日期','场景','优点','缺点','素材','评分','孩子反馈','推荐','状态'])}
function content(){tablePage('content','内容策划与数据',['id','pid','title','date','type','views','likes','saves','comments','dms','askLink','_cscore','status'],['编号','商品编号','标题','日期','类型','浏览','赞','收藏','评论','私信','问链接','表现分','状态'],'<button class="btn" onclick="sortContent()">按表现排序</button>')}
function orders(){tablePage('orders','订单与毛利',['id','pid','date','platform','price','cost','shipping','profit','method','afterSale','feedback'],['编号','商品编号','日期','平台','成交价','成本','运费','毛利','发货','售后','反馈'])}
function review(){tablePage('reviews','周复盘',['id','week','posts','best','worst','questions','continueItems','dropItems','next','manmanFeel','maxFeel'],['编号','周期','篇数','最好内容','最差内容','用户问题','继续商品','淘汰商品','下周计划','曼曼体感','Max体感'],'<button class="btn" onclick="autoReview()">生成本周复盘草稿</button>')}
function cellValue(k,r,f){if(f==='_margin')return margin(r).toFixed(0)+'%';if(f==='_score')return productScore(r);if(f==='_decision')return productDecision(r);if(f==='_cscore')return contentScore(r);return r[f]}function fmt(v){if(v==null)return '';let s=String(v);if(/^https?:\/\//i.test(s))return `<a target="_blank" rel="noopener" href="${attr(s)}">链接</a>`;return esc(s.length>76?s.slice(0,76)+'…':s)}function filterRows(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('#tbl tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}function sortProducts(){data.products.sort((a,b)=>productScore(b)-productScore(a));persist()}function sortContent(){data.content.sort((a,b)=>contentScore(b)-contentScore(a));persist()}function delRow(k,i){if(confirm('确定删除？')){data[k].splice(i,1);persist()}}
function openForm(k,i=null){const r=i==null?{}:data[k][i];document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="dialog"><h3>${i==null?'新增':'编辑'}</h3><form onsubmit="submitForm(event,'${k}',${i==null?'null':i})">${forms[k](r)}<footer><button type="button" class="btn" onclick="modal.remove()">取消</button><button class="btn primary">保存</button></footer></form></div></div>`)}
function input(n,l,v='',type='text',cls=''){return `<label class="${cls}"><div class="small">${esc(l)}</div><input name="${n}" type="${type}" value="${attr(v)}"></label>`}function area(n,l,v='',cls='full'){return `<label class="${cls}"><div class="small">${esc(l)}</div><textarea name="${n}">${esc(v)}</textarea></label>`}function sel(n,l,v,opts,cls=''){return `<label class="${cls}"><div class="small">${esc(l)}</div><select name="${n}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
const forms={products:r=>`<div class="formgrid">${input('id','编号',r.id||uid('P',data.products))}${input('name','商品名称',r.name)}${input('cat','品类',r.cat)}${input('source','来源平台',r.source||'1688')}${input('link','商品链接',r.link,'text','full')}${input('samplePrice','样品价',r.samplePrice,'number')}${input('supplyPrice','供货价',r.supplyPrice,'number')}${input('shipping','运费',r.shipping,'number')}${input('price','建议售价',r.price,'number')}${sel('dropship','一件代发',r.dropship||'是',['是','否','待确认'])}${input('shipFrom','发货地',r.shipFrom)}${input('moq','起订量',r.moq)}${sel('risk','售后风险',r.risk||'低',['低','中','高'])}${input('display','内容展示性1-5',r.display,'number')}${input('repurchase','复购可能1-5',r.repurchase,'number')}${input('manman','曼曼喜欢度1-5',r.manman,'number')}${sel('status','状态',r.status||'候选',['候选','买样','测试中','上架','淘汰'])}${input('created','创建日期',r.created||today(),'date')}${area('reason','AI推荐理由',r.reason)}${area('note','风险备注',r.note)}</div>`,samples:r=>`<div class="formgrid">${input('id','编号',r.id||uid('S',data.samples))}${input('pid','商品编号',r.pid)}${input('date','日期',r.date||today(),'date')}${input('scene','使用场景',r.scene)}${area('pros','优点',r.pros)}${area('cons','缺点',r.cons)}${input('photos','拍摄素材',r.photos)}${input('score','曼曼评分1-5',r.score,'number')}${area('kids','孩子反馈',r.kids)}${area('voice','曼曼语音转文字',r.voice)}${sel('recommend','是否愿意推荐',r.recommend||'待定',['是','否','待定'])}${sel('status','状态',r.status||'测试中',['待测','测试中','完成','淘汰'])}</div>`,content:r=>`<div class="formgrid">${input('id','编号',r.id||uid('C',data.content))}${input('pid','商品编号',r.pid)}${input('title','标题',r.title,'text','full')}${input('date','发布时间',r.date,'date')}${sel('type','类型',r.type||'图文',['图文','视频','合集','测评'])}${input('views','浏览',r.views,'number')}${input('likes','点赞',r.likes,'number')}${input('saves','收藏',r.saves,'number')}${input('comments','评论',r.comments,'number')}${input('dms','私信',r.dms,'number')}${input('askLink','问链接',r.askLink,'number')}${sel('status','状态',r.status||'草稿',['草稿','已发布','表现好','表现中','表现差'])}${area('note','正文/优化建议',r.note)}</div>`,orders:r=>`<div class="formgrid">${input('id','编号',r.id||uid('O',data.orders))}${input('pid','商品编号',r.pid)}${input('date','日期',r.date||today(),'date')}${input('platform','平台',r.platform||'微信小店')}${input('price','成交价',r.price,'number')}${input('cost','供货成本',r.cost,'number')}${input('shipping','运费',r.shipping,'number')}${input('profit','毛利',r.profit,'number')}${input('method','发货方式',r.method||'一件代发')}${sel('afterSale','是否售后',r.afterSale||'否',['否','是','处理中'])}${area('feedback','用户反馈',r.feedback)}</div>`,reviews:r=>`<div class="formgrid">${input('id','编号',r.id||uid('R',data.reviews))}${input('week','周期',r.week||today())}${input('posts','本周篇数',r.posts,'number')}${area('best','最好内容',r.best)}${area('worst','最差内容',r.worst)}${area('questions','用户最关心问题',r.questions)}${area('continueItems','继续商品',r.continueItems)}${area('dropItems','淘汰商品',r.dropItems)}${area('next','下周计划',r.next)}${sel('manmanFeel','曼曼体感',r.manmanFeel||'轻松',['轻松','一般','累'])}${sel('maxFeel','Max体感',r.maxFeel||'轻松',['轻松','一般','累'])}</div>`};
function submitForm(e,k,i){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries());Object.keys(obj).forEach(x=>{if(obj[x]!==''&&!isNaN(obj[x])&&['samplePrice','supplyPrice','shipping','price','display','repurchase','manman','score','views','likes','saves','comments','dms','askLink','cost','profit','posts'].includes(x))obj[x]=Number(obj[x])});if(k==='orders'&&(!obj.profit||obj.profit===0))obj.profit=(Number(obj.price)||0)-(Number(obj.cost)||0)-(Number(obj.shipping)||0);if(i==null)data[k].push(obj);else data[k][i]=obj;modal.remove();persist()}
function sampleToContent(i){const s=data.samples[i],p=data.products.find(x=>x.id===s.pid)||{};const id=uid('C',data.content);data.content.push({id,pid:s.pid,title:`${p.name||s.pid}真实试用：优点和缺点都说说`,date:'',type:'图文',views:0,likes:0,saves:0,comments:0,dms:0,askLink:0,status:'草稿',note:`使用场景：${s.scene||''}\n优点：${s.pros||''}\n缺点：${s.cons||''}\n孩子反馈：${s.kids||''}\n曼曼语音：${s.voice||''}\n\n请在 AI 工作台选择“曼曼语音转笔记”继续生成。`});persist();current='content';render();toast('已生成内容草稿')}
function ai(){let pOpts=data.products.map(p=>`<option value="${attr(p.id)}">${esc(p.id)} ${esc(p.name)}</option>`).join('');app.innerHTML=`<section class="panel"><h2>AI工作台</h2><div class="toolbar"><select id="aiMode"><option>曼曼语音转笔记</option><option>生成小红书笔记</option><option>生成选品评估</option><option>生成客服话术</option><option>生成周复盘</option><option>生成供应商询价</option></select><select id="aiPid"><option value="">不指定商品</option>${pOpts}</select><button class="btn primary" onclick="makeAI()">生成</button><button class="btn" onclick="copyOut()">复制结果</button></div><div class="two"><div><h3>补充输入</h3><textarea id="aiInput" placeholder="粘贴曼曼语音转文字、供应商信息、用户问题或本周数据..."></textarea><p class="small">提示：V2.1 仍不在前端保存 API key，也不直接联网调用 AI。复制结果给 AI 助手即可继续加工。</p></div><div><h3>输出</h3><div id="aiOut" class="prompt">选择模式后点击“生成”。</div></div></div></section>`}
function makeAI(){let mode=aiMode.value,pid=aiPid.value,p=data.products.find(x=>x.id===pid),s=data.samples.find(x=>x.pid===pid),extra=aiInput.value.trim();let out='';if(mode==='曼曼语音转笔记'){out=`请把下面曼曼的真实语音反馈整理成一篇小红书图文笔记。要求：像真实妈妈分享，不露脸、不硬广、不夸大，必须保留缺点，并给出适合/不适合人群。\n\n商品：${p?.name||'未指定'}\n品类：${p?.cat||''}\n商品风险备注：${p?.note||''}\n使用场景：${s?.scene||''}\n已记录优点：${s?.pros||''}\n已记录缺点：${s?.cons||''}\n孩子反馈：${s?.kids||''}\n曼曼语音：${s?.voice||extra}\n\n请输出：1）10个标题；2）正文；3）封面文案5条；4）6张图的拍摄顺序；5）评论区回复。`}else if(mode==='生成小红书笔记'){out=`请基于以下真实试用信息，生成小红书图文笔记。要求：不夸张、不硬广、保留缺点、适合25-40岁妈妈/二胎家庭。\n\n商品：${p?.name||'未指定'}\n品类：${p?.cat||''}\n推荐理由：${p?.reason||''}\n风险备注：${p?.note||''}\n使用场景：${s?.scene||''}\n优点：${s?.pros||''}\n缺点：${s?.cons||''}\n孩子反馈：${s?.kids||''}\n曼曼补充：${extra}\n\n请输出：1）8个标题；2）正文；3）封面文案5条；4）图片顺序；5）评论区回复。`}else if(mode==='生成选品评估'){out=`请评估这个商品是否适合“两宝家庭好物实验室”第一批测试。\n\n商品：${p?.name||''}\n售价/供货/运费：${p?.price||''}/${p?.supplyPrice||''}/${p?.shipping||''}\n毛利率：${p?margin(p).toFixed(1):''}%\n售后风险：${p?.risk||''}\n展示性/复购/曼曼喜欢度：${p?.display||''}/${p?.repurchase||''}/${p?.manman||''}\n系统评分/建议：${p?productScore(p):''}/${p?productDecision(p):''}\n链接/供应商信息：${p?.link||''}\n补充：${extra}\n\n请输出：是否买样、主要风险、建议售价、拍摄角度、淘汰条件。`}else if(mode==='生成客服话术'){out=`请为以下商品生成温和、真实、不过度承诺的客服话术。\n商品：${p?.name||''}\n优点：${s?.pros||p?.reason||''}\n缺点/风险：${s?.cons||p?.note||''}\n用户问题：${extra}\n\n请输出：好不好用、为什么比低价平台贵、能否优惠、收到不满意、发货时效、适合/不适合人群的话术。`}else if(mode==='生成供应商询价'){out=`请帮我生成给1688供应商的询价/确认话术。\n商品：${p?.name||''}\n目标：小红书家庭好物小批量测试，优先一件代发/低起订量。\n补充：${extra}\n\n需要确认：最低起订量、样品价、阶梯价、是否一件代发、发货地、退换货规则、质检/资质、破损赔付、是否可提供素材但不侵权。`}else{out=`请帮我做本周复盘。\n\n商品数据：\n${data.products.map(x=>`${x.id} ${x.name} 状态${x.status} 评分${productScore(x)} 建议${productDecision(x)} 毛利${margin(x).toFixed(0)}%`).join('\n')}\n\n内容数据：\n${data.content.map(x=>`${x.id} ${x.title} 浏览${x.views} 收藏${x.saves} 评论${x.comments} 私信${x.dms} 问链接${x.askLink} 表现分${contentScore(x)}`).join('\n')}\n\n订单数据：\n${data.orders.map(x=>`${x.pid} 成交${x.price} 毛利${x.profit} 售后${x.afterSale}`).join('\n')}\n\n曼曼/Max补充：${extra}\n\n请输出：继续商品、淘汰商品、下周内容选题、风险提醒、工作量是否需要降速。`}aiOut.innerText=out}
function copyOut(){navigator.clipboard.writeText(aiOut.innerText);toast('已复制')}function copyAI(k,i){current='ai';render();setTimeout(()=>{aiPid.value=data[k][i].pid||data[k][i].id||'';makeAI()},0)}
function autoReview(){let best=[...data.content].sort((a,b)=>contentScore(b)-contentScore(a))[0],worst=[...data.content].sort((a,b)=>contentScore(a)-contentScore(b))[0];data.reviews.push({id:uid('R',data.reviews),week:today(),posts:data.content.length,best:best?`${best.title}，表现分${contentScore(best)}`:'',worst:worst?`${worst.title}，表现分${contentScore(worst)}`:'',questions:data.content.filter(c=>Number(c.askLink)>0).map(c=>`${c.title}：${c.askLink}人问链接`).join('\n'),continueItems:data.products.filter(p=>productScore(p)>=65).map(p=>`${p.id} ${p.name}｜${productDecision(p)}`).join('\n'),dropItems:data.products.filter(p=>productScore(p)<40||p.risk==='高').map(p=>`${p.id} ${p.name}｜${productDecision(p)}`).join('\n'),next:'围绕表现好的品类继续发2-3篇；对有人问链接的商品评估上架；淘汰低分且曼曼不喜欢的商品。',manmanFeel:'轻松',maxFeel:'轻松'});persist()}
function validateImport(x){return x&&typeof x==='object'&&['products','samples','content','orders','reviews'].some(k=>Array.isArray(x[k]))}function exportJSON(){data.meta.lastBackupAt=today();localStorage.setItem(KEY,JSON.stringify(data));download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`liangbao-goodies-v21-backup-${today()}.json`);toast('已导出备份')}function importJSON(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!validateImport(x))throw new Error('不是有效的两宝好物系统备份');data=normalize(x);persist();toast('导入完成')}catch(err){alert('导入失败：'+err.message)}};rd.readAsText(f)}function exportCSV(){let out='';for(let [k,arr] of Object.entries(data)){if(!Array.isArray(arr))continue;out+=`\n[${k}]\n`;let hs=[...new Set(arr.flatMap(o=>Object.keys(o)))];out+=hs.join(',')+'\n';arr.forEach(o=>out+=hs.map(h=>'"'+String(o[h]??'').replaceAll('"','""')+'"').join(',')+'\n')}download(new Blob(['\ufeff'+out],{type:'text/csv'}),`liangbao-goodies-v21-${today()}.csv`)}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(confirm('会覆盖当前浏览器本地数据，确定恢复示例？')){data=structuredClone(seed);persist()}}
render();
</script>
